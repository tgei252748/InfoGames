<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
    <meta name="author" content="MatheusSantos">
    <meta name="description" content="A site about video games">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <ul class="navbar">
        <li><img src="res/image.png" alt="" class="logo"></li>
        <li><h1 style="color: beige;" class="title"><i>Info Games</i></h1></li>
        <a href="index.html" class="pages button1">Home</a>
        <a href="about.html" class="pages button2">About</a>
        <a href="avaliation.html" class="pages button3">Avaliations</a>
        <a href="singup.html" class="pages button4">Sing Up</a>
        <a href="login.html" class="pages button5">login</a>
    </ul>
    <div class="singup">
        <form class="space" id="signupForm"></form>
            <div class="space">
                <p style="color: beige;">Name</p>
                <input type="text" id="name" placeholder="Write here">
                <p style="color: beige;">Email</p>
                <input type="text" id="email" placeholder="Write here">
                <p style="color: beige;">Birth</p>
                <input type="text" id="birth" placeholder="Write here">
                <p style="color: beige;">Password</p>
                <input type="text" placeholder="Write here" style="margin-bottom: 30px;">
                <button type="button" class="button_singup pages" onclick="signup()">Sing Up</button>
            </div>
        </form>
    </div>
    <script>

        function signup() {

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let birth = document.getElementById("birth").value;

            localStorage.setItem("name", name);
            localStorage.setItem("email", email);
            localStorage.setItem("birth", birth);

            window.location.href = "indexLoged.html";
        }

    </script>
</body>
</html>
